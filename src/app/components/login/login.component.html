<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Sistema de Gestión</h1>
      <h2>Medicamentos Hospitalarios</h2>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="loginData.username"
          required
          [disabled]="loading"
          placeholder="Ingrese su usuario"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="loginData.password"
          required
          [disabled]="loading"
          placeholder="Ingrese su contraseña"
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="!loginForm.valid || loading"
        class="btn-login"
      >
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading">Iniciando...</span>
      </button>
    </form>

    <div class="login-help">
      <p><strong>Usuarios de prueba:</strong></p>
      <ul>
        <li><strong>admin</strong> / admin123 (Administrador)</li>
        <li><strong>medico1</strong> / medico123 (Médico)</li>
        <li><strong>farmacia</strong> / farma123 (Farmacéutico)</li>
      </ul>
    </div>
  </div>
</div>
